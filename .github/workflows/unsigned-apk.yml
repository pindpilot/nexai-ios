name: Build unsigned NexAI APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: python3 2-generate-android.py
      - run: gradle -p android assembleRelease
      - run: unzip -t android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NexAI-unsigned-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 1
          if-no-files-found: error
